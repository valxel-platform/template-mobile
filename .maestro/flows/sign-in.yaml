# Sign in through the product's Keycloak page in the system browser, with a test account of the
# environment (never a real person's: the release workflow passes TEST_USERNAME and TEST_PASSWORD).
appId: ${APP_ID}
name: sign-in
tags: [smoke]
---
- launchApp:
    clearState: true
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 20000
- tapOn:
    id: "username"
- inputText: ${TEST_USERNAME}
- tapOn:
    id: "password"
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: "kc-login"
- extendedWaitUntil:
    visible: "Greetings"
    timeout: 20000
